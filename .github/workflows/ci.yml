name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      # CI can never spend: no key exists here, and nothing leaves the machine with this set.
      EUNOE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Byte-compile
        run: python -m compileall -q src tests
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Demo, from the installed package
        run: python -m eunoe demo --quick
      - name: Conformance on the offline harness
        run: python -m eunoe conform
